name: Matecito Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "image_tag=ghcr.io/OWNER/REPO:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t "${{ steps.meta.outputs.image_tag }}" .

      - name: Push image
        run: |
          docker push "${{ steps.meta.outputs.image_tag }}"

      - name: Trigger Matecito release
        env:
          HOSTING_RELEASE_URL: ${{ secrets.MATECITO_HOSTING_RELEASE_URL }}
          HOSTING_DEPLOY_TOKEN: ${{ secrets.MATECITO_HOSTING_DEPLOY_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            -X POST "$HOSTING_RELEASE_URL" \
            -H "Content-Type: application/json" \
            -H "x-hosting-deploy-token: $HOSTING_DEPLOY_TOKEN" \
            -d '{
              "appId": "APP_ID",
              "imageTag": "ghcr.io/OWNER/REPO:'"${GITHUB_SHA::12}"'",
              "commitSha": "'"$GITHUB_SHA"'",
              "commitMessage": "'"${GITHUB_REF_NAME}"'",
              "commitAuthor": "'"${GITHUB_ACTOR}"'",
              "branch": "main",
              "runId": "'"$GITHUB_RUN_ID"'",
              "runNumber": "'"$GITHUB_RUN_NUMBER"'",
              "imageRepository": "ghcr.io/OWNER/REPO"
            }'
